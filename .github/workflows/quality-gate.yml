name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 先确认门禁本身没坏，再让门禁去判别人。
      - name: 门禁自测（证据链 / 高危命令）
        run: bash test/hooks.test.sh

      - name: 门禁自测（写入边界）
        run: bash test/writes.test.sh

      - name: 产物契约自测
        run: bash test/agents.test.sh

      - name: skill 结构校验
        run: node scripts/check-skills.mjs

      - name: skill 校验器自测
        run: bash test/skills.test.sh

      - name: Agent 定义与生成物一致
        run: node scripts/build-agents.mjs --check

      - name: 状态与证据链校验
        run: node scripts/ci-verify.mjs

      # hook 只拦 agent 走的那条路，人手动 commit 是直通的，这里兜住。
      # 只扫脚本类文件：文档里写 "rm -rf" 是在讲解规则，不是要执行它。
      - name: 高危命令扫描
        run: |
          set -uo pipefail
          BASE="origin/${{ github.base_ref || 'main' }}"
          FILES=$(git diff --name-only "$BASE"...HEAD -- \
            '*.sh' '*.bash' '*.mjs' '*.cjs' '*.js' '*.py' '*.yml' '*.yaml' 'Makefile' 'package.json' || true)
          if [ -z "$FILES" ]; then
            echo "本次改动没有脚本类文件，跳过"
            exit 0
          fi
          echo "$FILES"
          if echo "$FILES" | xargs grep -nE 'rm -rf /[^a-zA-Z]|git push (--force|-f)\b|--no-verify|curl[^|]*\| *(ba)?sh'; then
            echo "::error::检测到可疑命令，请人工确认后改用可回滚形式"
            exit 1
          fi
          echo "未发现高危命令"
