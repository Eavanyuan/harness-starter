name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 【临时诊断模式 R3】前两轮定位红段（verify:state / S6 组 / S7 组），本地无法复现。
      # 本轮：跑嫌疑段并捕获输出，红时以 ::error:: 注解吐出尾巴——注解 API 免认证可读。
      - name: 诊断（红段输出→注解）
        run: |
          set +e
          for seg in verify:state test:feishu-ask test:gate-regressions test:stale test:retro test:doctor-gates test:task-loop test:task-loop-contract; do
            LOG=$(mktemp)
            npm run -s "$seg" > "$LOG" 2>&1
            CODE=$?
            if [ $CODE -ne 0 ]; then
              TAIL=$(grep -E "✗|FAIL|Error|失败|结果" "$LOG" | tail -8 | head -c 900 | tr '\n' '|')
              echo "::error title=$seg::$TAIL"
              echo "[$seg] red, tail:"
              tail -20 "$LOG"
            else
              echo "[$seg] green"
            fi
          done
          exit 1
