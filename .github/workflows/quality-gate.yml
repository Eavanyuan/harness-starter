name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 高危命令扫描
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || printf '%s' "$BASE" | grep -qE '^0+$' || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)"
            fi
          fi
          echo "比较基线：$BASE … HEAD"
          FILES=$(git diff --name-only "$BASE"..HEAD -- \
            '*.sh' '*.bash' '*.mjs' '*.cjs' '*.js' '*.py' '*.yml' '*.yaml' 'Makefile' 'package.json' || true)
          if [ -z "$FILES" ]; then
            echo "本次改动没有脚本类文件，跳过"
            exit 0
          fi
          ADDED="$(mktemp)"
          trap 'rm -f "$ADDED"' EXIT
          printf '%s\n' "$FILES" | while IFS= read -r f; do
            [ -n "$f" ] || continue
            git diff -U0 "$BASE"..HEAD -- "$f" | grep -E '^\+' | grep -vE '^\+\+\+ ' >> "$ADDED" || true
          done
          NO_VERIFY="--no-ver""ify"
          HITS="$(grep -E \
            "rm[[:space:]]+-[A-Za-z]*(rf|fr)[A-Za-z]*[[:space:]]+/[^a-zA-Z]|git push (--force|-f)([^a-zA-Z]|$)|git push[^|]*[[:space:]]\+[^[:space:]]+|${NO_VERIFY}|(curl|wget)[^|]*\|[[:space:]]*(ba|z)?sh" \
            "$ADDED" | grep -vE 'scan-ok: .{8,}' || true)"
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::检测到可疑命令，请人工确认后改用可回滚形式（若确为断言素材，行尾加 scan-ok: <理由>）"
            exit 1
          fi
          echo "未发现高危命令"
      - name: 全量门禁（npm run gate）
        run: npm run gate
