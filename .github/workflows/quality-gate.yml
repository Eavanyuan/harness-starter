name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 【临时诊断模式 2026-11-21】CI 红 5 连但本地/新鲜克隆全绿（macOS），无日志权限——
      # 把 gate 拆成 8 步，用 jobs API 的每步结论定位红组（不需要读日志）。
      # 定位后立即恢复单步 gate（单清单原则）。
      - name: S1 静态链
        run: npm run -s doctor && npm run -s architect && npm run -s check:skills && npm run -s check:agents && npm run -s check:hooks
      - name: S2 状态与核心
        run: npm run -s verify:state && npm run -s test:glob && npm run -s test:hooks && npm run -s test:writes && npm run -s test:agents
      - name: S3 入口与证据
        run: npm run -s test:skills && npm run -s test:init && npm run -s test:harness-cli && npm run -s test:evidence && npm run -s test:verify-run
      - name: S4 账本与评审
        run: npm run -s test:ledger && npm run -s test:completeness && npm run -s test:wiring && npm run -s test:router && npm run -s test:ai-review
      - name: S5 飞书链
        run: npm run -s test:broker && npm run -s test:feishu-ws && npm run -s test:feishu-oauth && npm run -s test:feishu-bug-source && npm run -s test:feishu-sync
      - name: S6 回归与体检
        run: npm run -s test:feishu-ask && npm run -s test:gate-regressions && npm run -s test:stale && npm run -s test:retro && npm run -s test:doctor-gates
      - name: S7 task-loop
        run: npm run -s test:task-loop && npm run -s test:task-loop-contract
      - name: S8 性能与架构
        run: npm run -s test:architect && npm run -s test:perf-checks
